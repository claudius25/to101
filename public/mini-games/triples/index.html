<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slide &amp; Match: Triples</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="game.css?v=mobile-organ-display-3" />
  </head>
  <body>
    <section class="intro" aria-labelledby="intro-title">
      <div class="intro-lesson">
        <h1 id="intro-title" tabindex="-1">Make a match</h1>
        <div class="intro-board" role="group" aria-label="3 by 3 practice board">
          <span class="cell" id="intro-yellow" role="img" aria-label="Yellow tile, row 1, column 1"><span class="tile-face"></span></span>
          <span class="cell intro-partner" role="img" aria-label="Heart, row 1, column 2"><span class="tile-face"></span></span>
          <span class="cell" id="intro-blue" role="img" aria-label="Blue tile, row 1, column 3"><span class="tile-face"></span></span>
          <span class="cell empty" aria-hidden="true"></span>
          <span class="cell intro-partner" role="img" aria-label="Matching tile, row 2, column 2"><span class="tile-face"></span></span>
          <span class="cell empty" id="intro-middle-right" aria-hidden="true"></span>
          <button class="cell" id="intro-source" type="button" aria-label="Select bottom-left tile" aria-pressed="false"><span class="tile-face"></span></button>
          <button class="cell empty" id="intro-target" type="button" aria-label="Move selected tile here"><span class="tile-face"></span></button>
          <span class="cell empty" id="intro-bottom-right" role="img" aria-hidden="true"><span class="tile-face"></span></span>
          <span class="intro-gesture" aria-hidden="true">👆</span>
        </div>
      </div>
      <button id="intro-skip" type="button">SKIP INTRO TO PLAY</button>
    </section>
    <main hidden>
      <p id="instructions"></p>
      <div class="game-layout">
        <div class="difficulty" hidden>
          <div class="difficulty-selection" aria-hidden="true">
            <span id="difficulty-current"></span>
          </div>
          <input id="difficulty" type="range" min="0" step="1" aria-label="Difficulty" />
        </div>
        <div class="toolbar">
          <div class="board-controls">
            <label for="group-size">Group size</label>
            <select id="group-size" hidden>
              <option value="3">3 tiles</option>
              <option value="4">4 tiles</option>
            </select>
            <div class="board-actions">
              <div class="move-counter">
                <label for="move-count" id="moves-label"></label>
                <output class="move-count" id="move-count"></output>
              </div>
              <button id="shuffle" type="button"></button>
            </div>
          </div>
        </div>
        <div id="board" role="group">
          <div class="mobile-organ-display" id="mobile-organ-display" role="status"></div>
          <div id="board-result" aria-hidden="true" hidden></div>
        </div>
        <p id="status" role="status"></p>
      </div>
      <!-- <details>
        <summary id="reference-title"></summary>
        <ul id="reference"></ul>
      </details> -->
    </main>
    <script src="settings.js"></script>
    <script src="game.js"></script>
    <script src="intro.js"></script>
  </body>
</html>
