<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slide &amp; Match: Triples</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main>
      <h1 id="game-title"></h1>
      <p id="instructions"></p>
      <div class="toolbar">
        <div class="board-stats">
          <span id="score"></span>
          <span class="move-count"
            ><span id="moves-label"></span> <output id="move-count">0</output> /
            <span id="move-limit"></span
          ></span>
        </div>
        <button id="shuffle" type="button"></button>
      </div>
      <div id="board" role="group">
        <div id="board-result" aria-hidden="true" hidden></div>
      </div>
      <p id="status" role="status"></p>
      <details>
        <summary id="reference-title"></summary>
        <ul id="reference"></ul>
      </details>
    </main>
    <script src="settings.js"></script>
    <script src="game.js"></script>
  </body>
</html>
