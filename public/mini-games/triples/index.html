<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slide &amp; Match: Triples</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="game.css?v=moves-label-9" />
  </head>
  <body>
    <section class="intro" aria-labelledby="intro-title">
      <div class="intro-lesson">
        <h1 id="intro-title" tabindex="-1">Make a match</h1>
        <div class="intro-board" role="group" aria-label="4 by 4 practice board">
          <span class="cell" id="intro-yellow" role="img"><span class="tile-face"></span></span>
          <span class="cell intro-partner" role="img"><span class="tile-face"></span></span>
          <span class="cell" id="intro-blue" role="img"><span class="tile-face"></span></span>
          <span class="cell intro-partner" role="img"><span class="tile-face"></span></span>
          <button class="cell" id="intro-source" type="button" aria-label="Select bottom-left tile" aria-pressed="false"><span class="tile-face"></span></button>
          <button class="cell empty" id="intro-target" type="button" aria-label="Move selected tile here"><span class="tile-face"></span></button>
          <span class="cell" id="intro-black" role="img"><span class="tile-face"></span></span>
          <span class="intro-gesture" aria-hidden="true">👆</span>
        </div>
      </div>
      <button id="intro-skip" type="button">SKIP INTRO TO PLAY</button>
    </section>
    <main hidden>
      <div id="organ-fact" role="status"></div>
      <button id="settings-open" type="button" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings-dialog">⚙</button>
      <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" type="button" aria-label="Close settings">×</button>
        <div class="settings-slider">
          <div class="difficulty-selection" aria-hidden="true">
            <span id="difficulty-current"></span>
          </div>
          <input class="settings-range" id="difficulty" type="range" min="0" step="1" aria-label="Difficulty" />
        </div>
        <div class="settings-slider font-setting" hidden>
          <div class="font-setting-header">
            <label for="fact-font">Fact font</label>
            <span id="fact-font-preview" aria-hidden="true"></span>
          </div>
          <input class="settings-range" id="fact-font" type="range" min="0" step="1" />
        </div>
        <div class="settings-slider font-setting" hidden>
          <div class="font-setting-header">
            <label for="fact-font-size">Fact text size</label>
            <span id="fact-font-size-value" aria-hidden="true"></span>
          </div>
          <input class="settings-range" id="fact-font-size" type="range" min="14" max="36" value="18" step="1" />
        </div>
        <label for="group-size" hidden>Group size</label>
        <select id="group-size" hidden>
          <option value="3">3 tiles</option>
          <option value="4">4 tiles</option>
        </select>
        <button id="shuffle" type="button"><span>Play</span></button>
      </dialog>
      <div class="game-layout">
        <div class="toolbar">
          <div class="move-counter">
            <label for="move-count" id="moves-label"></label>
            <output class="move-count" id="move-count"></output>
          </div>
        </div>
        <div id="board" role="group">
          <div id="board-result" aria-hidden="true" hidden></div>
        </div>
        <p id="status" role="status"></p>
      </div>
      <!-- <details>
        <summary id="reference-title"></summary>
        <ul id="reference"></ul>
      </details> -->
    </main>
    <script src="settings.js"></script>
    <script src="game.js?v=refresh-14"></script>
    <script src="intro.js?v=refresh-14"></script>
  </body>
</html>
